<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="marco"><rect width="512" height="512" rx="116"/></clipPath>
    <!-- Silueta del perro: orejas, cabeza y cuello -->
    <path id="orejaI" d="M182 122 C 148 116 114 126 96 148 C 82 166 84 190 90 214 C 100 254 116 286 136 304 C 150 316 166 308 166 290 C 166 260 158 224 162 194 C 164 170 172 144 182 122 Z"/>
    <path id="orejaD" d="M330 122 C 364 116 398 126 416 148 C 430 166 428 190 422 214 C 412 254 396 286 376 304 C 362 316 346 308 346 290 C 346 260 354 224 350 194 C 348 170 340 144 330 122 Z"/>
    <path id="cabeza" d="M256 108 C 336 108 382 154 382 226 C 382 292 362 350 330 384 C 310 406 286 414 256 414 C 226 414 202 406 182 384 C 150 350 130 292 130 226 C 130 154 176 108 256 108 Z"/>
    <path id="cuello" d="M180 370 C 172 430 166 500 166 560 L 346 560 C 346 500 340 430 332 370 Z"/>
  </defs>
  <rect width="512" height="512" rx="116" fill="#FBF6EF"/>
  <g clip-path="url(#marco)">
    <circle cx="256" cy="270" r="210" fill="#F1C79B"/>
    <!-- Informe detrás -->
    <g transform="rotate(16 392 150)">
      <rect x="324" y="52" width="140" height="178" rx="10" fill="#FFFFFF" stroke="#4A2C1C" stroke-width="8"/>
      <line x1="346" y1="86" x2="414" y2="86" stroke="#D9883E" stroke-width="9" stroke-linecap="round"/>
      <line x1="346" y1="110" x2="440" y2="110" stroke="#4A2C1C" stroke-width="6" stroke-linecap="round" opacity=".4"/>
      <line x1="346" y1="130" x2="440" y2="130" stroke="#4A2C1C" stroke-width="6" stroke-linecap="round" opacity=".4"/>
      <line x1="346" y1="150" x2="420" y2="150" stroke="#4A2C1C" stroke-width="6" stroke-linecap="round" opacity=".4"/>
    </g>
    <!-- Contorno blanco (efecto sticker) -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round">
      <use href="#cuello"/><use href="#orejaI"/><use href="#orejaD"/><use href="#cabeza"/>
    </g>
    <!-- Cuello y collar -->
    <use href="#cuello" fill="#4A2C1C"/>
    <path d="M168 432 C 226 452 286 452 344 432 L 346 470 C 286 492 226 492 166 470 Z" fill="#D9883E"/>
    <circle cx="256" cy="490" r="19" fill="#D9883E" stroke="#4A2C1C" stroke-width="6"/>
    <!-- Cabeza -->
    <use href="#cabeza" fill="#4A2C1C"/>
    <!-- Orejas (encima del borde de la cabeza para que resalten) -->
    <use href="#orejaI" fill="#2B180E"/>
    <use href="#orejaD" fill="#2B180E"/>
    <!-- Pliegue de la oreja -->
    <path d="M96 148 C 114 126 148 116 182 122 C 176 136 168 146 154 150 C 134 150 112 156 92 170 C 90 162 92 154 96 148 Z" fill="#4F2F1E"/>
    <path d="M416 148 C 398 126 364 116 330 122 C 336 136 344 146 358 150 C 378 150 400 156 420 170 C 422 162 420 154 416 148 Z" fill="#4F2F1E"/>
    <!-- Hocico -->
    <path d="M256 276 C 306 276 336 304 336 340 C 336 380 302 402 256 402 C 210 402 176 380 176 340 C 176 304 206 276 256 276 Z" fill="#6B4129"/>
    <!-- Cejas -->
    <path d="M194 206 C 208 196 226 196 238 204" fill="none" stroke="#D9883E" stroke-width="8" stroke-linecap="round"/>
    <path d="M318 206 C 304 196 286 196 274 204" fill="none" stroke="#D9883E" stroke-width="8" stroke-linecap="round"/>
    <!-- Ojos -->
    <circle cx="216" cy="240" r="17" fill="#1E120A"/>
    <circle cx="296" cy="240" r="17" fill="#1E120A"/>
    <circle cx="222" cy="233" r="5.5" fill="#FBF6EF"/>
    <circle cx="302" cy="233" r="5.5" fill="#FBF6EF"/>
    <!-- Nariz -->
    <path d="M220 300 C 220 282 292 282 292 300 C 292 322 272 336 256 336 C 240 336 220 322 220 300 Z" fill="#1E120A"/>
    <ellipse cx="244" cy="296" rx="9" ry="4.5" fill="#FBF6EF" opacity=".35"/>
    <!-- Boca -->
    <path d="M256 336 L 256 354" stroke="#1E120A" stroke-width="7" stroke-linecap="round"/>
    <path d="M224 356 C 236 372 252 368 256 354 C 260 368 276 372 288 356" fill="none" stroke="#1E120A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
